name: verify
on: [push, pull_request]
jobs:
  fast-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: paper artifact hashes
        run: cd papers && sha256sum -c SHA256SUMS
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: 0060 exact Gaussian fidelity self-test
        run: python verification/0060/gauss_fidelity.py
      - name: 0060 covariance-level suite (repaired theorem, gapped lemma, admissibility, lattice CT)
        run: python verification/0060/verify_covariance.py
      - name: 0060 repaired-theorem sweep (Banchi)
        run: python verification/0060/part2_banchi.py
      - name: 0060 Petz pipeline control
        run: python verification/0060/control_petz.py
      - name: 0061 full verification
        run: python verification/0061/verify_0061.py
      - name: 0064 Combes-Thomas oracle
        run: python verification/0064/ct_oracle.py
      - name: 0070 main verification
        run: python verification/0070/verify_0070.py
      - name: 0072 rate-inheritance figure oracle
        run: python verification/0072/make_rip_figure.py
      - name: 0073 Davies corrected identity oracle
        run: python verification/0073/verify_corrected.py
      - name: 0073 Davies witness table oracle
        run: python verification/0073/witness_tfim.py
      - name: 0073 interface verification
        run: python verification/0073/verify_0073.py
      - name: 0085 synthesis verification
        run: python verification/0085/verify_0085.py
      - name: 0091 heat-kernel symbolic verification
        run: python verification/0091/verify_0091.py
      - name: 0102 induced-gravity sign verification
        run: python verification/0102/verify_0102.py
      - name: 0105 offline re-analysis demo
        run: python verification/0105/reanalyze_0105.py --demo --output-dir "$RUNNER_TEMP/aqft-0105-demo"
      - name: 2601.0007 Gaussian recovery verification
        run: python verification/2601-0007/verify_2601_0007.py
      - name: 2601.0020 geometric Markov/RIP verification
        run: python verification/2601-0020/verify_2601_0020.py
      - name: 2601.0022 influence proxy verification
        run: python verification/2601-0022/verify_2601_0022.py
      - name: 2601.0023 Davies interface verification
        run: python verification/2601-0023/verify_2601_0023.py
      - name: 2601.0031 typed pipeline verification
        run: python verification/2601-0031/verify_2601_0031.py
      - name: 2601.0034 modular recovery verification
        run: python verification/2601-0034/verify_2601_0034.py
      - name: 2601.0035 non-Gaussian bridge verification
        run: python verification/2601-0035/verify_2601_0035.py
      - name: 2601.0038 criticality Petz-distance verification
        run: python verification/2601-0038/verify_2601_0038.py --smoke
      - name: 2601.0040 Petz finite-size scaling smoke
        run: python verification/2601-0040/verify_2601_0040.py --smoke
      - name: 2601.0042 emergent distance smoke
        run: python verification/2601-0042/verify_2601_0042.py --smoke
      - name: 2601.0043 recoverability geometry smoke
        run: python verification/2601-0043/verify_2601_0043.py --smoke
      - name: 2601.0044 Z2 gauge ladder smoke
        run: python verification/2601-0044/verify_2601_0044.py --smoke
      - name: 2601.0046 Petz AQFT finite-dimensional verification
        run: python verification/2601-0046/verify_2601_0046.py
      - name: 2601.0047 Z2 benchmark smoke
        run: python verification/2601-0047/verify_2601_0047.py --smoke
      - name: 2601.0050 CMI Z2 benchmark smoke
        run: python verification/2601-0050/verify_2601_0050.py --smoke
      - name: 2601.0051 Z2 ED/TN ladder smoke
        run: python verification/2601-0051/verify_2601_0051.py --smoke
      - name: 2601.0064 RIP-U Davies finite verification
        run: python verification/2601-0064/verify_2601_0064.py
      - name: 2601.0065 Type III recoverability finite anchor
        run: python verification/2601-0065/verify_2601_0065.py
      - name: 2601.0066 typed pipeline finite verification
        run: python verification/2601-0066/verify_2601_0066.py
      - name: 2601.0099 Program A CMI finite verification
        run: python verification/2601-0099/verify_2601_0099.py
      - name: 2601.0111 Z2 CMI/Petz finite verification
        run: python verification/2601-0111/verify_2601_0111.py
      - name: 2601.0115 algebraic toy finite verification
        run: python verification/2601-0115/verify_2601_0115.py
  # Long suites (verify_repaired, verify_0060, modelB, sensitivity, 0101,
  # 2601.0023 --with-tfim, 2601.0035 --N11,
  # 2601.0038/0040/0042/0043/0044/0047/0050/0051 default/chunked grids;
  # 2601.0099 --tenpy; and
  # 0105 on-device JSON reanalysis once data are restored) are
  # documented with reference logs in results/ and run manually.
